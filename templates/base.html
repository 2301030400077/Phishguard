<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1730">
  <title>{% block title %}PhishGuard{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark site-nav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}"><span class="brand-mark">P</span> PhishGuard</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span
          class="navbar-toggler-icon"></span></button>
      <div class="collapse navbar-collapse" id="mainNav">
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          <a class="nav-link" href="{{ url_for('home') }}#check-url">Check URL</a>
          <a class="nav-link" href="{{ url_for('about') }}">About</a>
          <a class="nav-link" href="{{ url_for('dataset') }}">Dataset</a>
        </div>
      </div>
    </div>
  </nav>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">
    <div class="container d-flex flex-column flex-sm-row justify-content-between gap-2"><span>PhishGuard · University
        minor project</span><span>URL analysis happens locally; submitted sites are not visited.</span></div>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

</html>
